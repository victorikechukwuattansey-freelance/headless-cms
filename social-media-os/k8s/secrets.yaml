# ─────────────────────────────────────────────────────────
# Social Media OS — SealedSecret template
# ─────────────────────────────────────────────────────────
# This is a template reference. In production, use
# kubeseal to create actual SealedSecrets:
#
#   kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# Then apply the sealed secret (safe to commit):
#   kubectl apply -f sealed-secret.yaml
# ─────────────────────────────────────────────────────────

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: smos-secrets
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/part-of: social-media-os
spec:
  encryptedData:
    # These are placeholder keys. Replace with actual sealed values.
    DATABASE_PASSWORD: ""
    REDIS_PASSWORD: ""
    JWT_SECRET: ""
    JWT_REFRESH_SECRET: ""
    OPENAI_API_KEY: ""
    ANTHROPIC_API_KEY: ""
    GEMINI_API_KEY: ""
    NEXTAUTH_SECRET: ""
    ENCRYPTION_KEY: ""
    FACEBOOK_APP_ID: ""
    FACEBOOK_APP_SECRET: ""
    INSTAGRAM_APP_ID: ""
    INSTAGRAM_APP_SECRET: ""
    TWITTER_CLIENT_ID: ""
    TWITTER_CLIENT_SECRET: ""
    TWITTER_BEARER_TOKEN: ""
    LINKEDIN_CLIENT_ID: ""
    LINKEDIN_CLIENT_SECRET: ""
    TIKTOK_CLIENT_KEY: ""
    TIKTOK_CLIENT_SECRET: ""
    PINTEREST_CLIENT_ID: ""
    PINTEREST_CLIENT_SECRET: ""
    YOUTUBE_CLIENT_ID: ""
    YOUTUBE_CLIENT_SECRET: ""
    YOUTUBE_API_KEY: ""
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    SENTRY_DSN: ""
    POSTHOG_KEY: ""
    DATADOG_API_KEY: ""
    RESEND_API_KEY: ""
    SMTP_HOST: ""
    SMTP_PORT: ""
    SMTP_USER: ""
    SMTP_PASS: ""
    SLACK_WEBHOOK_URL: ""
    S3_ACCESS_KEY_ID: ""
    S3_SECRET_ACCESS_KEY: ""
    S3_ENDPOINT: ""
    WEBHOOK_SECRET: ""
---
