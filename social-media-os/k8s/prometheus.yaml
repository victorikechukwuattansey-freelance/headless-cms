apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smos-api
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: social-media-os
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: social-media-os
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
    - port: http
      interval: 30s
      scrapeTimeout: 10s
      path: /health
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smos-web
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: social-media-os
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: social-media-os
      app.kubernetes.io/component: web
  endpoints:
    - port: http
      interval: 15s
      scrapeTimeout: 10s
      path: /api/metrics
---
