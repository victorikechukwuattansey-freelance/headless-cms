apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smos-api-pdb
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: social-media-os
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: social-media-os
      app.kubernetes.io/component: api
