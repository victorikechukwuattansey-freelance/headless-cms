apiVersion: v1
kind: Service
metadata:
  name: smos-postgres
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: social-media-os
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: smos
  labels:
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: social-media-os
spec:
  serviceName: smos-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: social-media-os
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-media-os
        app.kubernetes.io/component: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "smos"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smos-secrets
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: "social_media_os"
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - smos
                - -d
                - social_media_os
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - smos
                - -d
                - social_media_os
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          lifecycle:
            preStop:
              exec:
                command:
                  - pg_ctl
                  - stop
                  - -D
                  - /var/lib/postgresql/data
                  - -m
                  - fast
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://smos:$(POSTGRES_PASSWORD)@localhost:5432/social_media_os?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smos-secrets
                  key: DATABASE_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: postgres-config
          configMap:
            name: smos-postgres-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: smos-postgres-config
  namespace: smos
data:
  postgresql.conf: |
    max_connections = 200
    shared_buffers = 1GB
    effective_cache_size = 3GB
    maintenance_work_mem = 256MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 200
    work_mem = 5242kB
    min_wal_size = 2GB
    max_wal_size = 8GB
    max_worker_processes = 8
    max_parallel_workers_per_gather = 4
    max_parallel_workers = 8
    max_parallel_maintenance_workers = 4
    ssl = on
    ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
    ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
