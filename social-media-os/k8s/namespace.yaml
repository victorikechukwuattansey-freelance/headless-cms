apiVersion: v1
kind: Namespace
metadata:
  name: smos
  labels:
    name: smos
    environment: production
    app.kubernetes.io/name: social-media-os
    app.kubernetes.io/part-of: social-media-os
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: smos-quota
  namespace: smos
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: 10
    pods: 50
    services: 20
---
apiVersion: v1
kind: LimitRange
metadata:
  name: smos-limits
  namespace: smos
spec:
  limits:
    - default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      type: Container
