name: CD - Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  IMAGE_TAG: ${{ github.sha }}
  STAGING_KUBE_CONFIG: ${{ secrets.STAGING_KUBE_CONFIG }}
  PRODUCTION_KUBE_CONFIG: ${{ secrets.PRODUCTION_KUBE_CONFIG }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment:
      name: staging
      url: https://staging.socialmediaos.com
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30"

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ env.STAGING_KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Kubernetes manifests with image tag
        run: |
          sed -i "s|image: .*/api:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}|g" k8s/api-deployment.yaml
          sed -i "s|image: .*/web:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.IMAGE_TAG }}|g" k8s/web-deployment.yaml

      - name: Deploy to staging
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/redis-statefulset.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/web-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/pdb.yaml

      - name: Wait for rollout
        run: |
          kubectl -n smos rollout status deployment/api --timeout=300s
          kubectl -n smos rollout status deployment/web --timeout=300s

      - name: Verify deployment health
        run: |
          kubectl -n smos get pods
          kubectl -n smos get svc
          kubectl -n smos get ingress

  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "9"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright E2E tests
        run: pnpm test:e2e:playwright
        env:
          BASE_URL: https://staging.socialmediaos.com
          PLAYWRIGHT_API_URL: https://staging.socialmediaos.com/api

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://socialmediaos.com
    steps:
      - name: Manual approval gate
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.APPROVAL_TOKEN }}
          approvers: ${{ vars.PRODUCTION_APPROVERS }}
          minimum-approvals: 2
          issue-title: "Deploy ${{ github.sha }} to production"
          issue-body: "Approve deployment of commit ${{ github.sha }} to production environment"

      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30"

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Kubernetes manifests with image tag
        run: |
          sed -i "s|image: .*/api:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}|g" k8s/api-deployment.yaml
          sed -i "s|image: .*/web:.*|image: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.IMAGE_TAG }}|g" k8s/web-deployment.yaml

      - name: Deploy to production
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/web-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/pdb.yaml

      - name: Wait for rollout
        run: |
          kubectl -n smos rollout status deployment/api --timeout=300s
          kubectl -n smos rollout status deployment/web --timeout=300s

      - name: Post-deployment smoke test
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" https://socialmediaos.com/health
          curl -f -s -o /dev/null -w "%{http_code}" https://socialmediaos.com/api/health

      - name: Notify team
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Deployment of ${{ github.sha }} to production complete :rocket:",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Deployment of <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> to *production* complete :rocket:"
                  }
                }
              ]
            }
