services:
  postgres:
    image: postgres:16-alpine
    container_name: smos-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: smos
      POSTGRES_PASSWORD: smos_secret
      POSTGRES_DB: social_media_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smos -d social_media_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smos-network

  redis:
    image: redis:7-alpine
    container_name: smos-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smos-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: smos-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://smos:smos_secret@postgres:5432/social_media_os
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api/src:/app/apps/api/src
    networks:
      - smos-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: smos-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./apps/web/src:/app/apps/web/src
    networks:
      - smos-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  smos-network:
    driver: bridge
