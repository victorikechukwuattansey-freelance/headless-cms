name: LCOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lcos
          POSTGRES_PASSWORD: lcos
          POSTGRES_DB: lcos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd backend && pnpm install
          cd ../frontend && pnpm install

      - name: Check linting
        run: |
          cd backend && pnpm lint
          cd ../frontend && pnpm lint

      - name: Type check
        run: |
          cd backend && pnpm typecheck || true
          cd ../frontend && pnpm typecheck

      - name: Generate Prisma client
        run: |
          cd backend && npx prisma generate
        env:
          DATABASE_URL: postgresql://lcos:lcos@localhost:5432/lcos_test

      - name: Run migrations
        run: |
          cd backend && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://lcos:lcos@localhost:5432/lcos_test

      - name: Run backend tests
        run: |
          cd backend && pnpm test -- --coverage
        env:
          DATABASE_URL: postgresql://lcos:lcos@localhost:5432/lcos_test
          JWT_SECRET: test-secret
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run frontend tests
        run: |
          cd frontend && pnpm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          directory: ./coverage
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          cd backend && pnpm install
          cd ../frontend && pnpm install

      - name: Build backend
        run: cd backend && pnpm build

      - name: Build frontend
        run: cd frontend && pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/.next

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_ID }}
          vercel-args: '--prebuilt'

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        uses: bervproject/railway-deploy-action@v2
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service: lcos-backend

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_ID }}
          vercel-args: '--prod --prebuilt'
