<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Roof replacement before and after</title>
  <desc id="d">A patchy, dark roof on the left, a clean new terracotta roof on the right.</desc>
  <rect width="400" height="460" fill="#cfd4d6"/>
  <rect x="400" width="400" height="460" fill="#cfe0d8"/>
  <polygon points="40,210 360,60 360,210" fill="#5d5b57"/>
  <polygon points="440,210 760,60 760,210" fill="#a15c2f"/>
  <rect x="0" y="210" width="800" height="60" fill="#b0a99b"/>
  <rect x="90" y="270" width="120" height="190" fill="#8d8a84"/>
  <rect x="230" y="270" width="130" height="190" fill="#8d8a84"/>
  <rect x="480" y="270" width="120" height="190" fill="#c9b28d"/>
  <rect x="620" y="270" width="140" height="190" fill="#c9b28d"/>
  <rect x="105" y="330" width="90" height="80" fill="#7a7771"/>
  <rect x="495" y="330" width="90" height="80" fill="#a88b66"/>
  <polygon points="360,60 380,52 400,60" fill="#cfd4d6"/>
  <polygon points="760,60 780,52 800,60" fill="#cfe0d8"/>
  <line x1="400" y1="0" x2="400" y2="460" stroke="#fff" stroke-width="4" opacity="0.7"/>
  <text x="60" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#6b655a">BEFORE</text>
  <text x="460" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#4a3b2c">AFTER</text>
</svg>
