  <title id="t">Living room tiling before and after</title>
  <desc id="d">A worn carpeted living room on the left, a bright room with polished porcelain tiles on the right.</desc>
  <rect width="400" height="460" fill="#d8d2c6"/>
  <rect x="400" width="400" height="460" fill="#f6f1e6"/>
  <rect y="330" width="400" height="130" fill="#8f8a7d"/>
  <rect x="400" y="330" width="400" height="130" fill="#c8b394"/>
  <g stroke="#a99a82" stroke-width="2">
    <path d="M400 330h400M400 395h400M500 330v130M650 330v130M550 330v130M700 330v130"/>
  </g>
  <rect x="40" y="160" width="180" height="90" fill="#a3a79f"/>
  <rect x="60" y="250" width="140" height="40" fill="#8c9089"/>
  <rect x="430" y="160" width="180" height="90" fill="#5f7161"/>
  <rect x="450" y="250" width="140" height="40" fill="#4a5a4c"/>
  <rect x="270" y="130" width="90" height="200" fill="#b8b3a6"/>
  <rect x="660" y="130" width="90" height="200" fill="#8b5e3c"/>
  <rect x="285" y="150" width="60" height="60" fill="#e9e3d6"/>
  <line x1="400" y1="0" x2="400" y2="460" stroke="#fff" stroke-width="4" opacity="0.7"/>
  <text x="60" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#6b655a">BEFORE</text>
  <text x="460" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#4a3b2c">AFTER</text>
