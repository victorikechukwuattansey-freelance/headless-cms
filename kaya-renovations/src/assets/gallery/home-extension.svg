<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Home extension before and after</title>
  <desc id="d">A small plain house on the left, the same house with a warm two-storey extension on the right.</desc>
  <rect width="400" height="460" fill="#d3d6d2"/>
  <rect x="400" width="400" height="460" fill="#dce8de"/>
  <rect y="330" width="400" height="130" fill="#a3b39b"/>
  <rect x="400" y="330" width="400" height="130" fill="#7d9b84"/>
  <polygon points="40,170 200,90 360,170" fill="#7d7a72"/>
  <polygon points="440,170 600,90 760,170" fill="#a15c2f"/>
  <rect x="70" y="170" width="260" height="160" fill="#c2bda9"/>
  <rect x="140" y="220" width="60" height="110" fill="#8f8a7d"/>
  <rect x="470" y="170" width="90" height="160" fill="#e8dcc3"/>
  <rect x="580" y="170" width="160" height="160" fill="#c9b28d"/>
  <rect x="530" y="230" width="60" height="100" fill="#a88b66"/>
  <rect x="620" y="250" width="60" height="80" fill="#8b5e3c"/>
  <rect x="580" y="120" width="160" height="50" fill="#e8dcc3"/>
