services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-failure-analyzer-db
    environment:
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer
      POSTGRES_DB: ai_failure_analyzer
    ports:
      - "5433:5432"
    volumes:
      - analyzer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer -d ai_failure_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  analyzer_pgdata:
