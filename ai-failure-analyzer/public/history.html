<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Previous Reports &mdash; AI Failure Analyzer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="nav">
    <span class="brand">AI<span>FailureAnalyzer</span></span>
    <span class="links">
      <a href="/">Landing</a>
      <a href="/upload.html">Upload Logs</a>
      <a href="/history.html">Previous Reports</a>
    </span>
  </nav>

  <main>
    <h1>Previous reports</h1>
    <p class="sub">All analyses are stored locally in PostgreSQL. Raw logs are never kept &mdash; only redacted, truncated steps.</p>

    <div class="card">
      <table>
        <thead>
          <tr><th>Date</th><th>Failure</th><th>Confidence</th><th>Source</th><th></th></tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
    <p id="empty" class="muted" style="margin-top:16px" hidden>No reports yet. <a href="/upload.html">Analyze your first log</a>.</p>
  </main>

  <script>
    const TYPE_COLORS = {
      wrong_prompt: 'amber',
      wrong_tool_selection: 'purple',
      missing_context: 'purple',
      hallucination: 'red',
      infinite_loop: 'red',
      timeout: 'amber',
      invalid_output: 'amber',
      api_failure: 'red',
      context_overflow: 'amber',
    };

    async function load() {
      const rows = document.getElementById('rows');
      const empty = document.getElementById('empty');
      let res;
      try {
        res = await fetch('/api/reports');
      } catch {
        rows.innerHTML = '<tr><td colspan="5" class="muted">Cannot reach the server</td></tr>';
        return;
      }
      const data = await res.json();
      if (!data.reports.length) {
        rows.innerHTML = '';
        empty.hidden = false;
        return;
      }
      rows.innerHTML = data.reports.map((r) => {
        const pct = Math.round(r.confidence * 100);
        const color = TYPE_COLORS[r.failureType] || 'accent';
        return `
          <tr>
            <td class="muted">${new Date(r.createdAt).toLocaleString()}</td>
            <td><a href="/report.html?id=${encodeURIComponent(r.id)}">${escapeHtml(r.summary)}</a></td>
            <td><span class="badge ${color}">${escapeHtml(r.failureType)}</span></td>
            <td>${pct}%</td>
            <td class="muted">${escapeHtml(r.sourceFormat)}</td>
          </tr>`;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    load();
  </script>
</body>
</html>
