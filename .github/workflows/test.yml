name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: n8n-lead-recovery full suite + frozen integrity + security gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-lead-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install (zero runtime dependencies)
        run: npm install --no-audit --no-fund
      - name: Full test suite
        run: npm test
      - name: Frozen artifact integrity
        run: npm run verify:frozen
      - name: Security gate
        run: node scripts/security-check.js