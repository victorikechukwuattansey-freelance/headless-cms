name: ReconcileKit CI

# Only run when reconcilekit/** or this workflow itself changes. Other
# monorepo projects (agency-os, n8n-lead-recovery, etc.) are not covered
# by this workflow and are not affected by it.
on:
  push:
    paths:
      - "reconcilekit/**"
      - ".github/workflows/reconcilekit-ci.yml"
  pull_request:
    paths:
      - "reconcilekit/**"
      - ".github/workflows/reconcilekit-ci.yml"

# Cancel superseded runs on the same ref to avoid queuing behind stale runs.
concurrency:
  group: reconcilekit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (reconcilekit/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconcilekit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Core requires Node >=24.12.0 for native TypeScript type-stripping.
          # '24' resolves to the latest 24.x line.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: reconcilekit/package-lock.json

      - name: Install
        run: npm ci

      # The core's test runner is recursive: from reconcilekit/, `node --test`
      # discovers both src/** and storefront/test/**. The storefront job below
      # also runs its own suite; the duplication is intentional so each job
      # fails independently and reports scoped results.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  storefront:
    name: Storefront (reconcilekit/storefront/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            reconcilekit/package-lock.json
            reconcilekit/storefront/package-lock.json

      # The storefront imports core source files by relative path (see the
      # Phase 2 freeze: no workspace linking, no declared dependency). Those
      # core files import `csv-parse`, which is a *core* runtime dependency.
      # On a fresh CI checkout, only the storefront tree would be installed,
      # so `csv-parse` would not be resolvable from the core source and every
      # test file that imports a core module would fail on load. Installing
      # both trees keeps the current architecture (relative imports, no
      # workspace) working on a clean checkout.
      - name: Install core dependencies
        run: npm ci
        working-directory: reconcilekit

      - name: Install storefront dependencies
        run: npm ci
        working-directory: reconcilekit/storefront

      - name: Test
        run: npm test
        working-directory: reconcilekit/storefront

      - name: Typecheck
        run: npm run typecheck
        working-directory: reconcilekit/storefront
