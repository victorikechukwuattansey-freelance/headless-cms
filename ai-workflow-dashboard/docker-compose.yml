services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: awd-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workflow
    ports:
      - "5434:5432"
    volumes:
      - awd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: awd-redis
    ports:
      - "6379:6379"
    volumes:
      - awd_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: awd-ollama
    ports:
      - "11434:11434"
    volumes:
      - awd_ollama:/root/.ollama

volumes:
  awd_pgdata:
  awd_redisdata:
  awd_ollama:
